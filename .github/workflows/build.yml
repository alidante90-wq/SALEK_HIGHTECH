name: Build SALEK HIGHTECH VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone JUCE
      run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR=../JUCE -DCMAKE_VERBOSE_MAKEFILE=ON

    - name: Build
      run: |
        cd build
        cmake --build . --config Release --target SALEK_HIGHTECH_VST3

    - name: Find VST3 files
      run: |
        Write-Host "===== Searching for VST3 ====="
        Get-ChildItem -Path build -Recurse -Filter "*.vst3" | ForEach-Object { $_.FullName }
        Get-ChildItem -Path build -Recurse -Directory | Where-Object { $_.Name -like "*VST3*" -or $_.Name -like "*artefacts*" } | ForEach-Object { $_.FullName }
        Write-Host "===== Listing build folder ====="
        Get-ChildItem -Path build -Recurse | Select-Object -First 80 FullName

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: SALEK-HIGHTECH-Build
        path: build/
        if-no-files-found: warn
