name: Build SALEK HIGHTECH VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone JUCE
      run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR=../JUCE

    - name: List available targets
      run: |
        cd build
        cmake --build . --target help

    - name: Build main target
      run: |
        cd build
        cmake --build . --config Release

    - name: Find VST3 and artefacts
      run: |
        Write-Host "===== Searching for VST3 / artefacts ====="
        Get-ChildItem -Path . -Recurse -ErrorAction SilentlyContinue | Where-Object {
          $_.Name -like "*VST3*" -or $_.Name -like "*artefacts*" -or $_.Name -like "*.vst3*" -or $_.Name -like "*SALEK*"
        } | ForEach-Object { $_.FullName }

    - name: Upload build folder
      uses: actions/upload-artifact@v4
      with:
        name: SALEK-HIGHTECH-Build
        path: build/
        if-no-files-found: warn
