name: Build SALEK HIGHTECH VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      
      - name: Clone JUCE 8.0.15
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git
      
      - name: Build VST3
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR=../JUCE
          cmake --build . -j$(nproc)
      
      - name: Upload VST3 artifact (Linux)
        uses: actions/upload-artifact@v3
        with:
          name: SALEK_HIGHTECH_Linux_VST3
          path: build/SALEK_HIGHTECH_artefacts/Release/VST3/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Clone JUCE 8.0.15
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git
      
      - name: Build VST3
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR=../JUCE
          cmake --build . -j$(sysctl -n hw.ncpu)
      
      - name: Upload VST3 artifact (macOS)
        uses: actions/upload-artifact@v3
        with:
          name: SALEK_HIGHTECH_macOS_VST3
          path: build/SALEK_HIGHTECH_artefacts/Release/VST3/
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Clone JUCE 8.0.15
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git
      
      - name: Build VST3
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR=../JUCE
          cmake --build . --config Release
      
      - name: Upload VST3 artifact (Windows)
        uses: actions/upload-artifact@v3
        with:
          name: SALEK_HIGHTECH_Windows_VST3
          path: build/SALEK_HIGHTECH_artefacts/Release/VST3/
          retention-days: 30
